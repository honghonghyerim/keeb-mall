<!DOCTYPE html>
<!--<html lang="en">-->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <!-- 부트스트랩 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow p-4" style="width: 400px;">
        <!-- keeb-Mall 로고 -->
        <h2 class="text-center fw-bold mb-4 text-primary">keeb-Mall</h2>

        <!-- 로그인 폼 -->
        <form action="/login" method="post">

            <!-- 아이디 텍스트박스 -->
            <div class="mb-3">
                <label for="username" class="form-label">아이디</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="아이디를 입력하세요" required>
            </div>

            <!-- 비밀번호 텍스트박스 -->
            <div class="mb-3">
                <label for="password" class="form-label">비밀번호</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="비밀번호를 입력하세요" required>
            </div>

            <!-- 로그인 버튼 -->
            <button type="submit" class="btn btn-primary w-100 mb-2">로그인</button>

            <!-- 회원가입 버튼 -->
            <a href="/signup" class="btn btn-outline-secondary w-100">회원가입</a>
        </form>
    </div>

</body>

</html>
