<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>키보드</title>
    <!-- 부트스트랩 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        /* Reset & Global */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #fcfcfc;
            color: #1a1a1a;
            line-height: 1.5;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ul {
            list-style: none;
        }

        /* Header Top */
        .header-top {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 40px;
            background-color: #ffffff;
            border-bottom: 1px solid #eaeaea;
        }

        .logo-area {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .logo-area a {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #111111;
        }

        .user-menu {
            display: flex;
            gap: 20px;
            font-size: 13px;
            color: #666666;
            margin-left: auto; /* 우측 정렬을 위해 */
        }

        .user-menu a:hover {
            color: #111111;
        }

        .hidden-menu {
            display: none; /* 마이페이지 숨김 처리 */
        }

        /* Navigation Bar & Dropdown */
        .nav-bar {
            display: flex;
            justify-content: center;
            background-color: #ffffff;
            border-bottom: 1px solid #eaeaea;
            position: relative;
            z-index: 100;
        }

        .nav-item {
            position: relative;
        }

        .nav-item > a {
            display: block;
            padding: 18px 35px;
            font-size: 15px;
            font-weight: 500;
            color: #1a1a1a;
            transition: color 0.2s ease;
        }

        .nav-item > a:hover {
            color: #000000;
            font-weight: 600;
        }


        /* 마우스를 올렸을 때(.nav-item:hover) 서브 메뉴 등장 */
        .nav-item:hover .dropdown-menu {
            display: block;
            opacity: 1;
        }

        .dropdown-menu li a {
            display: block;
            padding: 10px 20px;
            font-size: 14px;
            color: #555555;
            text-align: center;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .dropdown-menu li a:hover {
            background-color: #f8f8f8;
            color: #000000;
            font-weight: 500;
        }

    </style>

</head>
<body class="bg-light">

<!-- 상단 영역 -->
<header class="header-top">
    <!-- 최상단 정중앙 로고 -->
    <div class="logo-area">
        <a href="/">KEEB-MALL</a>
    </div>

    <!-- 우측 유저 메뉴 -->
    <div class="user-menu">
        <!-- 로그인 했을때 -->
        <th:block th:if="${session.loginUser != null}">
            <a href="/logout">로그아웃</a>
            <!-- 마이페이지는 우선 숨김 -->
            <a href="/mypage" class="hidden-menu">마이페이지</a>
            <a href="/orders">주문조회</a>
            <a href="/cart">장바구니</a>
        </th:block>

        <th:block th:if="${session.loginUser == null}">
            <a href="/login">로그인</a>
            <a href="/signup">회원가입</a>
        </th:block>

    </div>
</header>

<!-- 메뉴바 -->
<nav class="nav-bar">

    <div class="nav-item">
        <a href="/">메인</a>
    </div>

    <!-- 키보드 (마우스 올리면 드롭다운) -->
    <div class="nav-item">
        <a href="/product/keyboard">키보드</a>
        <ul class="dropdown-menu">
            <li><a href="/product/keyboard/mechanical">기계식</a></li>
            <li><a href="/product/keyboard/capacitive">무접점</a></li>
        </ul>
    </div>

    <!-- 스위치 (마우스 올리면 드롭다운) -->
    <div class="nav-item">
        <a href="/product/switch">스위치</a>
        <ul class="dropdown-menu">
            <li><a href="/product/switch/linear">리니어</a></li>
            <li><a href="/product/switch/tactile">택타일</a></li>
        </ul>
    </div>

    <div class="nav-item">
        <a href="/product/keycap">키캡</a>
    </div>
</nav>

<!--&lt;!&ndash; 상단 네비게이션바 (메인과 동일한 공통 컴포넌트 또는 코드) &ndash;&gt;-->

<!-- 메인 컨테이너 -->
<div class="container my-5" style="max-width: 1100px;">

    <!-- 상단 컨트롤 영역 (왼쪽: 상품 수 / 오른쪽: 정렬 트리) -->
    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
        <!-- 왼쪽: 전체 상품 수 -->
        <div class="fs-5 fw-semibold text-secondary">
            전체 상품 <span class="text-primary fw-bold" th:text="${totalCount}">0</span>개
        </div>

        <!-- 오른쪽: 정렬 트리 (최신순 / 인기순) -->
        <div class="dropdown">
            <button class="btn btn-outline-secondary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown">
                정렬 기준
            </button>
            <ul class="dropdown-menu">
                <!-- 현재 카테고리 경로를 유지하면서 정렬 쿼리스트링 전달 -->
                <li><a class="dropdown-item" th:href="@{${currentCategory == null ? '/product/keyboard' : '/product/keyboard/' + currentCategory}(sort='latest')}">최신순</a></li>
                <li><a class="dropdown-item" th:href="@{${currentCategory == null ? '/product/keyboard' : '/product/keyboard/' + currentCategory}(sort='popular')}">인기순</a></li>
            </ul>
        </div>
    </div>

    <!-- 상품 카드 그리드 영역 -->
    <div class="row row-cols-1 row-cols-md-3 g-4">
        <!-- 데이터가 없을 때 -->
        <div class="col-12 text-center py-5" th:if="${#lists.isEmpty(keyboardList)}">
            <p class="text-muted fs-5">등록된 상품이 없습니다.</p>
        </div>

        <!-- 데이터가 있을 때 반복문 (th:each) -->
        <div class="col" th:each="keyboard : ${keyboardList}">
            <div class="card h-100 shadow-sm border-0">
                <!-- 이미지 클릭 시 상세 페이지로 이동 (/product/detail/{id}) -->
                <a th:href="@{/product/detail/{id}(id=${keyboard.id})}">
                    <img th:src="${keyboard.imgUrl}" class="card-img-top object-fit-cover" style="height: 240px;" alt="키보드 이미지">
                </a>
                <div class="card-body">
                    <!-- 키보드 네임 -->
                    <h5 class="card-title fw-bold text-dark">
                        <a th:href="@{/product/detail/{id}(id=${keyboard.id})}" class="text-decoration-none text-dark" th:text="${keyboard.name}">키보드 이름</a>
                    </h5>
                    <!-- 가격 및 간단 정보 -->
                    <p class="card-text text-primary fw-bold mt-2" th:text="${#numbers.formatInteger(keyboard.price, 3, 'COMMA') + '원'}">159,000원</p>
                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
