<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메인화면</title>
    <style>
        /* Reset & Global */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #fcfcfc;
            color: #1a1a1a;
            line-height: 1.5;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ul {
            list-style: none;
        }

        /* Header Top */
        .header-top {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 40px;
            background-color: #ffffff;
            border-bottom: 1px solid #eaeaea;
        }

        .logo-area {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .logo-area a {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #111111;
        }

        .user-menu {
            display: flex;
            gap: 20px;
            font-size: 13px;
            color: #666666;
            margin-left: auto; /* 우측 정렬을 위해 */
        }

        .user-menu a:hover {
            color: #111111;
        }

        .hidden-menu {
            display: none; /* 마이페이지 숨김 처리 */
        }

        /*!* Navigation Bar *!*/
        /*.nav-bar {*/
        /*    display: flex;*/
        /*    justify-content: center;*/
        /*    gap: 40px;*/
        /*    padding: 16px 0;*/
        /*    background-color: #ffffff;*/
        /*    border-bottom: 1px solid #eaeaea;*/
        /*    font-size: 15px;*/
        /*    font-weight: 500;*/
        /*}*/

        .nav-bar a:hover {
            color: #000000;
            font-weight: 600;
        }

        /* Hero Section (대문짝만한 키보드 이미지) */
        .hero-section {
            width: 100%;
            height: 550px;
            background-color: #1e1e1e; /* 모노톤 감성 배경 */
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero-section img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.85; /* 고급스러운 톤 조절 */
        }

        .hero-text {
            position: absolute;
            text-align: center;
            color: #ffffff;
            text-shadow: 0 4px 12px rgba(0,0,0,0.3);
        }

        .hero-text h1 {
            font-size: 38px;
            font-weight: 600;
            letter-spacing: -1px;
            margin-bottom: 10px;
        }

        .hero-text p {
            font-size: 16px;
            color: #cccccc;
        }

        /* Navigation Bar & Dropdown */
        .nav-bar {
            display: flex;
            justify-content: center;
            background-color: #ffffff;
            border-bottom: 1px solid #eaeaea;
            position: relative;
            z-index: 100;
        }

        .nav-item {
            position: relative;
        }

        .nav-item > a {
            display: block;
            padding: 18px 35px;
            font-size: 15px;
            font-weight: 500;
            color: #1a1a1a;
            transition: color 0.2s ease;
        }

        .nav-item > a:hover {
            color: #000000;
            font-weight: 600;
        }

        /* 하단 서브 메뉴 (기본 숨김 처리) */
        .dropdown-menu {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            background-color: #ffffff;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid #eaeaea;
            border-top: none;
            padding: 8px 0;
            display: none; /* 평소엔 숨김 */
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        /* 마우스를 올렸을 때(.nav-item:hover) 서브 메뉴 등장 */
        .nav-item:hover .dropdown-menu {
            display: block;
            opacity: 1;
        }

        .dropdown-menu li a {
            display: block;
            padding: 10px 20px;
            font-size: 14px;
            color: #555555;
            text-align: center;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .dropdown-menu li a:hover {
            background-color: #f8f8f8;
            color: #000000;
            font-weight: 500;
        }

    </style>
</head>
<body>

<!-- 상단 영역 -->
<header class="header-top">
    <!-- 최상단 정중앙 로고 -->
    <div class="logo-area">
        <a href="/">KEEB-MALL</a>
    </div>

    <!-- 우측 유저 메뉴 -->
    <div class="user-menu">
        <!-- 로그인 했을때 -->
        <th:block th:if="${session.loginUser != null}">
            <a href="/logout">로그아웃</a>
            <!-- 마이페이지는 우선 숨김 -->
            <a href="/mypage" class="hidden-menu">마이페이지</a>
            <a href="/orders">주문조회</a>
            <a href="/cart">장바구니</a>
        </th:block>

        <th:block th:if="${session.loginUser == null}">
        <a href="/login">로그인</a>
        <a href="/signup">회원가입</a>
        </th:block>

    </div>
</header>

<!-- 메뉴바 -->
<nav class="nav-bar">

    <div class="nav-item">
        <a href="/">메인</a>
    </div>

    <!-- 키보드 (마우스 올리면 드롭다운) -->
    <div class="nav-item">
        <a href="/product/keyboard">키보드</a>
        <ul class="dropdown-menu">
            <li><a href="/product/keyboard/mechanical">기계식</a></li>
            <li><a href="/product/keyboard/capacitive">무접점</a></li>
        </ul>
    </div>

    <!-- 스위치 (마우스 올리면 드롭다운) -->
    <div class="nav-item">
        <a href="/product/switch">스위치</a>
        <ul class="dropdown-menu">
            <li><a href="/product/switch/linear">리니어</a></li>
            <li><a href="/product/switch/tactile">택타일</a></li>
        </ul>
    </div>

    <div class="nav-item">
        <a href="/product/keycap">키캡</a>
    </div>
</nav>

<!-- 키보드 이미지 대문짝만하게 들어가는 영역 -->
<section class="hero-section">
    <!-- 임시 고화질 커스텀 키보드 언스플래시 이미지 (원하는 이미지 주소로 교체 가능) -->
    <img src="https://images.unsplash.com/photo-1587829741301-dc798b83add3?auto=format&fit=crop&w=1920&q=80" alt="Custom Keyboard Hero Image">
    <div class="hero-text">
        <h1>Precision in Every Keystroke</h1>
        <p>나만의 완벽한 타이핑 경험을 만나보세요.</p>
    </div>
</section>

</body>
</html>
