<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <!-- 부트스트랩 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- 스크립트 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        //html 그려지기전에 자바스크립트 실행
        document.addEventListener('DOMContentLoaded', function() {


            // html 문서안에서 id가 username 인 요소를 찾아와서 usernameInput 상수에 담는다
            const usernameInput = document.getElementById('username');
            const toastElement = document.getElementById('liveToast');
            const toastMessage = document.getElementById('toastMessage');
            const btnCheck = document.getElementById('btn_Check');
            const checkResult = document.getElementById('checkResult');

            // 부트스트랩 토스트 객체 생성 (autoHide: true, delay: 3000초 = 3초)
            const toast = new bootstrap.Toast(toastElement, { delay: 3000 });

            let isUsernameChecked = false; // 중복 체크 통과 여부

            //아이디 입력창에 글자를 한 글자라도 바꾸면 무조건 중복체크 초기화!
            usernameInput.addEventListener('input', function() {
                isUsernameChecked = false;
            });

            // 중복확인 버튼을 '클릭'했을 때 실행되도록 변경
            btnCheck.addEventListener('click', function() {
                const username = usernameInput.value.trim();

                // 아이디 입력창이 비어있을 때만 실행
                if (username === '') {
                    checkResult.innerText = '아이디를 입력하세요!';
                    checkResult.style.color = 'red';
                    usernameInput.focus();

                    setTimeout(function() {
                        checkResult.innerText = '';
                    }, 3000);

                    return;
                }

                /*
                * 서버에 POST 방식으로 아이디 보냄 (Ajax)
                * fetch : 페이지를 새로고침하지 않고, 백에서 스프링서버('/check-username')로 아이디를 POST 방식으로 던짐
                * .then(response => response.text()) 서버가 처리해서 돌려준 응답 테스트를 받아옴
                * */

                fetch('/check-username', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, //데이터 형식
                    body: 'username=' + encodeURIComponent(username) //입력한아이디 (username)
                })
                    .then(response => response.text()) // 서버의 "duplicated" 또는 "available" 받기, 순수한텍스트
                    .then(data => { // 서버가 보내준 저텍스트를 data 변수로 받아서 검사 시작
                        if (data === 'duplicated') {
                            alert('이미 사용 중인 아이디입니다.');
                            usernameInput.value = '';
                            usernameInput.focus();
                            isUsernameChecked = false;

                        } else {
                            checkResult.innerText = '사용 가능한 아이디입니다!';
                            checkResult.style.color = 'blue';
                            isUsernameChecked = true;

                            setTimeout(function() {
                                checkResult.innerText = '';
                            }, 3000);

                        }

                    })
                    .catch(error => {
                        console.error('에러 발생:', error);
                    });
            });

            const signupForm = document.getElementById('signupForm'); // 폼 태그 ID

            //가입하기 버튼을 눌러 폼을 서버로 제출 하려고 할때 검사하는 곳
            signupForm.addEventListener('submit', function(event) {
                if (!isUsernameChecked) {
                    event.preventDefault(); // 폼 전송 막기!
                    toastMessage.innerText = '아이디 중복 체크를 먼저 해주세요!';
                    toast.show();
                    usernameInput.focus();
                    return;
                }
                // 2. 주소 입력 확인
                if (document.getElementById('postcode').value === '') {
                    event.preventDefault();
                    toastMessage.innerText = '주소를 입력해주세요';
                    toast.show();
                    document.getElementById('btn_find_addr').focus();
                    return;
                }
            });

            // 우편번호 찾기 버튼 클릭 시 카카오 팝업창 호출
            const btnFindAddr = document.getElementById('btn_find_addr');

            btnFindAddr.addEventListener('click', function() {
                new daum.Postcode({     //카카오 주소 팝업창 객체를 만듬
                    oncomplete: function(data) {    //사용자가 팝업에서 주소를 골라 완료했을때(oncomplete) 실행될함수 지정
                        let addr = ''; // 주소 변수

                        // 사용자가 선택한 주소 타입에 따라 도로명 주소 혹은 지번 주소 값을 가져옴
                        if (data.userSelectedType === 'R') { // 도로명 주소
                            addr = data.roadAddress;
                        } else { // 지번 주소
                            addr = data.jibunAddress;
                        }

                        // 우편번호와 주소 정보를 해당 input 박스에 꽂아넣기
                        document.getElementById('postcode').value = data.zonecode;
                        document.getElementById('address').value = addr;

                        // 상세주소 입력창에 자동으로 포커스 이동!
                        document.getElementById('detailAddress').focus();
                    }
                }).open();
            });

        });

        const msg = "[[${signupMessage}]]";
        if (msg && msg !== "null" && msg !== "") {
            alert(msg);
        }

    </script>


</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">

<div class="card shadow p-5" style="width: 500px;">
    <h1 class="text-center fw-bold mb-4 text-primary">keeb-Mall</h1>
    <h5 class="text-center text-muted mb-4">회원가입</h5>

    <!-- 회원가입 폼 (POST 요청) -->
    <form id="signupForm" action="/signup" method="post">

        <!-- 아이디 입력 + 중복체크 버튼 -->
        <div class="mb-3">
            <label for="username" class="form-label fw-bold">아이디</label>
            <div class="input-group">
                <input type="text" class="form-control form-control-lg" id="username" name="username" placeholder="아이디를 입력하세요" required>
                <button type="button" class="btn btn-outline-secondary" id="btn_Check">중복체크</button>
            </div>
            <div id="checkResult" class="form-text"></div>
        </div>

        <!-- 토스트 메시지 영역 -->
        <div class="position-fixed top-0 start-50 translate-middle-x p-3" style="z-index : 1080;">
            <div id="liveToast" class="toast align-items-center text-white bg-dark border-0" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="d-flex">
                    <div id="toastMessage" class="toast-body">
                    </div>
                </div>
            </div>
        </div>

        <!-- 비밀번호 입력 -->
        <div class="mb-3">
            <label for="password" class="form-label fw-bold">비밀번호</label>
            <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="비밀번호를 입력하세요" required>
        </div>

        <!-- 이름 입력 텍스트박스 추가 -->
        <div class="mb-4">
            <label for="name" class="form-label fw-bold">이름</label>
            <input type="text" class="form-control form-control-lg" id="name" name="name" placeholder="이름을 입력하세요" required>
        </div>

        <!-- 주소 입력 영역 -->
        <div class="mb-4">
            <label class="form-label fw-bold">주소</label>
            <div class="input-group mb-2">
                <input type="text" class="form-control" id="postcode" name="postcode" placeholder="우편번호" readonly>
                <button type="button" class="btn btn-outline-secondary" id="btn_find_addr">우편번호 찾기</button>
            </div>
            <input type="text" class="form-control mb-2" id="address" name="address" placeholder="기본 주소" readonly>
            <input type="text" class="form-control" id="detailAddress" name="detailAddress" placeholder="상세 주소를 입력하세요">
        </div>

        <!-- 가입하기 버튼 -->
        <button type="submit" class="btn btn-primary btn-lg w-100 mb-3" id="btn_Join">가입하기</button>

        <!-- 로그인 화면으로 돌아가기 링크 -->
        <div class="text-center">
            <a href="/login" class="text-decoration-none" style="font-size: 15px;">이미 계정이 있으신가요? 로그인</a>
        </div>
    </form>
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
</div>

</body>
</html>
